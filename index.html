  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y:flex;align-items:center;gap:12px\">\n          <svg width=\"52\" height=\"26\" sc-camel-view-box=\"-10.2 -2.9 49 24.1\" aria-hidden=\"true\"><g transform=\"skewX(-22)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 1.5H0V19.5H18V12M0 10.5H8\"><\u002Fpath><path d=\"M29 16.8H36V-1.2H18V6.3M36 7.8H28\"><\u002Fpath><\u002Fg><\u002Fsvg>\n          <span style=\"font-family:'Quicksand',sans-serif;font-size:25px;line-height:1;color:#FFFFFF\">eidos<span style=\"color:#6E8DB8\">flow<\u002Fspan><\u002Fspan>\n        <\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#A3B2C7;max-width:260px\">{{ pos.slogan }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:14px\">\n        <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#A3B2C7\">{{ t.footer.follow }}<\u002Fh2>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ social }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <li>\n              <sc-if value=\"{{ s.url }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ s.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;gap:10px;color:#FFFFFF\" style-hover=\"color:#A3B2C7\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" aria-hidden=\"true\" style=\"fill:currentColor;flex:none\"><path d=\"{{ s.icon }}\"><\u002Fpath><\u002Fsvg>{{ s.label }}<\u002Fa>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ s.inactive }}\" hint-placeholder-val=\"{{ true }}\">\n                <span aria-disabled=\"true\" style=\"display:inline-flex;align-items:center;gap:10px;color:#A3B2C7\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" aria-hidden=\"true\" style=\"fill:currentColor;flex:none\"><path d=\"{{ s.icon }}\"><\u002Fpath><\u002Fsvg>{{ s.label }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:24px;border-top:1px solid rgba(163,178,199,.14);font-size:12.5px;color:#A3B2C7\">\n      <span style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px\"><span>© 2026 EidosFlow. {{ t.footer.rights }}<\u002Fspan><a href=\"{{ hrefs.legal }}\" sc-camel-on-click=\"{{ go.legal }}\" style=\"color:#A3B2C7\" style-hover=\"color:#FFFFFF\">{{ t.footer.legal }}<\u002Fa><a href=\"{{ hrefs.privacy }}\" sc-camel-on-click=\"{{ go.privacy }}\" style=\"color:#A3B2C7\" style-hover=\"color:#FFFFFF\">{{ t.footer.privacy }}<\u002Fa><\u002Fspan>\n      <a href=\"#\" sc-camel-on-click=\"{{ toTop }}\" style=\"color:#A3B2C7\" style-hover=\"color:#FFFFFF\">{{ t.footer.top }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showReview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Relecture&quot;}}\">\nclass Component extends DCLogic {\n  static SLUGS = {\n    fr: { home: '', capabilities: 'savoir-faire', blog: 'blog', about: 'a-propos', legal: 'mentions-legales', privacy: 'confidentialite' },\n    en: { home: '', capabilities: 'capabilities', blog: 'blog', about: 'about', legal: 'legal-notice', privacy: 'privacy' }\n  };\n  static DSLUG = { fr: { cyber: 'cybersecurite', data: 'data', ai: 'ia' }, en: { cyber: 'cybersecurity', data: 'data', ai: 'ai' } };\n  static POSTS = [{\n    slug: 'genai-roi',\n    title: 'Turning GenAI into Business Impact: The ROI Approach',\n    author: 'Sofiane Medjkoune',\n    role: { fr: 'Co-fondateur · Stratégie Data & IA', en: 'Co-founder · Data and AI Strategy' },\n    category: { fr: 'Data & IA', en: 'Data & AI' },\n    date: { fr: '24 août 2025', en: 'August 24, 2025' },\n    read: { fr: '5 min de lecture', en: '5 min read' },\n    excerpt: { fr: 'Mesurer le retour sur investissement d’un projet d’IA générative dès le premier jour : critères de succès métier, lien entre indicateurs techniques et métier, et restitution adaptée à chaque public.', en: 'Measuring the ROI of a generative AI project from day one: business success criteria, linking technical and business metrics, and reporting tailored to each audience.' },\n    source: 'https://medium.com/@sofiane.mdjk/turning-genai-into-business-impact-the-roi-approach-8e25614b4cf3',\n    blocks: [\n      ['p', 'Over the past six years working in a data science consulting firm, I’ve seen a recurring challenge: companies love experimenting with Data Science and AI projects, but struggle to prove its actual business impact, and this is even more the case with GenAI projects.'],\n      ['p', 'When clients invest hundreds of thousands, or even millions, into GenAI projects, they don’t just want a shiny RAG demo that impresses in the boardroom, they want reassurance that what we’re building will deliver measurable value to their teams, customers, and bottom line.'],\n      ['p', 'From finance to retail to healthcare, businesses everywhere are exploring what Generative AI can do for them. They’re racing to:'],\n      ['ul', ['Build chatbots and Q&A tools to leverage internal data and documents', 'Generate content across formats and channels producing a steady flow of marketing and communication assets ranging from LinkedIn posts and blog articles to product brochures and client emails.', 'Automate customer support for faster responses', 'Summarize and synthesize mountains of documents']],\n      ['p', 'At first, these initiatives feel transformative. Yet the excitement fades quickly, and teams begin to wonder: Is anyone actually using this tool? Did it really make our work faster or easier? What’s the business impact compared to the cost?'],\n      ['p', 'That’s why being able to measure ROI, from day one, is not just a nice to have, it is the foundation of any successful GenAI initiative. Without it, projects risk being dismissed as expensive experiments rather than real transformation.'],\n      ['p', 'In this report, Google presents a global survey of enterprise adoption and value.'],\n      ['p', 'When it comes to proving whether financial and operational gains truly come from AI initiatives, many companies are still navigating in the dark. Even C-level leaders admit they struggle to connect GenAI investments with measurable outcomes. A Deloitte study found that 41% of organizations face challenges in quantifying the real impact of their AI projects a clear sign that ROI remains one of the biggest blind spots in adoption'],\n      ['p', 'Without ROI measurement, these questions are hard to answer. And that’s where projects lose momentum. McKinsey highlights this same principle: companies that define value metrics early are 3x more likely to scale GenAI successfully.'],\n      ['p', 'In this article, we’ll outline the key steps to effectively measure the ROI of a Generative AI project. In a following article, we’ll deep dive the technical side, showing how your teams can build the right tools and frameworks to track ROI in practice.'],\n      ['p', 'Before discussing the technical side such as model selection, APIs, architecture, we must start with the business alignment.'],\n      ['h2', 'Step 1: Define business success criteria'],\n      ['p', 'What strategic outcome is this project supposed to drive? (Efficiency, revenue, customer experience, innovation?) How do we measure it in terms the business already understands?'],\n      ['p', 'Not all projects are alike, but these three indicators consistently cut through the noise:'],\n      ['h3', '1. Time Saved vs. Previous Workflows (Saved FTEs)'],\n      ['ul', ['Compare how long a task took before vs. after GenAI.', 'Translate the difference into full-time equivalents (FTEs) or cost savings.']],\n      ['ex', 'Example: drafting a legal summary goes from 2 hours to 20 minutes → 83% time saved.'],\n      ['h3', '2. Adoption & Sustained Usage'],\n      ['ul', ['A GenAI tool only creates value if people actually use it.', 'Track active users, frequency of use, and retention over time.']],\n      ['ex', 'Example: a Q&A assistant used daily by 70% of sales reps is far more valuable than one that only a few try once.'],\n      ['h3', '3. Direct Business KPIs'],\n      ['ul', ['Revenue uplift', 'Customer satisfaction (NPS, CSAT)', 'Cost per interaction', 'Lead conversion rates']],\n      ['ex', 'Example: GenAI-powered support reduces cost per ticket by 25% while boosting CSAT by 12%.'],\n      ['h2', 'Step 2: Connect business metrics to technical metrics'],\n      ['p', 'Once you set your business success criteria, based on strategic targets, the technical KPIs come into play. Too often, teams stop here and track only things like “accuracy” or “latency.” But these need to be tied back to business outcomes. Think of it as a layered framework:'],\n      ['ul', ['Business KPIs → the language of the boardroom', 'Product KPIs → engagement, adoption, satisfaction', 'Technical KPIs → the underlying mechanics of performance']],\n      ['p', 'These layers are built on top of technical KPIs. The following examples illustrate how we move from technical to business metrics:'],\n      ['ul', ['Accuracy & Relevance → adoption & trust', 'Latency → employee productivity & user satisfaction', 'Cost per Query → operational cost savings', 'Bias / Toxicity / Hallucination Rates → compliance & adoption risk']],\n      ['p', 'The goal is to ensure that every technical dashboard doesn’t just display numbers in isolation, but tells a clear business orientation. Latency, accuracy, or cost per query are valuable metrics, but on their own, they mean little to decision-makers.'],\n      ['p', 'In other words, your ROI tracking dashboard should bridge the gap between what your GenAI product does and why it matters for the business.'],\n      ['h2', 'Step 3: Deliver the right metrics to the right audience'],\n      ['p', 'Defining ROI metrics is key, but not enough. We need to make sure they’re delivered to the right people, in the right format. A single “ROI report” won’t work for everyone. Product owners and executives care about very different levels of detail.'],\n      ['p', 'A Product Owner, for instance, is a day to day consumer of the ROI dashboard. They need detailed, operational insights on adoption trends, usage patterns, and performance issues to decide whether to improve, pivot, or scale a feature. For them, the dashboard should provide enough granularity to diagnose problems and opportunities at the product level.'],\n      ['p', 'At the other end of the spectrum, C-level executives are also consumers of ROI reporting, but their needs are very different. They expect a high-level, strategic view that translates AI performance into business value:'],\n      ['ul', ['Executive scorecards in Power BI with 3–5 top KPIs, refreshed monthly or quarterly.', 'Visual storytelling: trend lines showing time saved, adoption growth, and customer satisfaction gains.', 'Benchmark comparisons: ROI of GenAI projects vs. other digital initiatives.', 'One-page summaries for board discussions, emphasizing outcomes not inputs.']],\n      ['p', 'The key is that for each type of consumer, you rely on the same underlying data pipeline and what changes is the level of abstraction and the narrative.'],\n      ['h2', 'Conclusion'],\n      ['p', 'Measuring the ROI of GenAI projects isn’t something you tack on at the end, it’s the starting point that turns exciting innovation into real, measurable business value.'],\n      ['p', 'Remember the following steps:'],\n      ['ul', ['Start by defining your business success criteria: Define target outcomes and select the right indicators in terms businesses and decision makers understands.', 'Build the bridge from technical metrics to business outcomes: Make sure performance data supports the business story.', 'Deliver your ROI report to the right audience: Tailor the level of detail to each consumer (POs, C-levels…etc) ensures your metrics don’t just exist, but actually drive action.']],\n      ['p', 'But this is only half the picture. In the following article, we’ll dive into the technical side of ROI measurement, exploring how DI platforms (like Databricks or Vertex AI) can help you capture the right metrics, and how to bring them all together in a business-friendly Power BI dashboard.']\n    ]\n  }];\n  static CLIENTS = [\n    ['servier', 'Servier'], ['decathlon', 'Decathlon'], ['credit-agricole', 'Crédit Agricole'], ['loreal', 'L’Oréal'],\n    ['pernod-ricard', 'Pernod Ricard'], ['trigano', 'Trigano'], ['euipo', 'EUIPO']\n  ];\n  static POS = {\n    fr: {\n      name: 'Conseil technologique & expertise technique',\n      slogan: 'Expertise That Moves You Forward.',\n      triad: 'Vision stratégique. Profondeur technique. Regard humain.',\n      mission: 'EidosFlow aide les dirigeants à transformer leur stratégie en résultats concrets, grâce au conseil et à l’expertise technique.',\n      desc: 'EidosFlow est un cabinet indépendant de conseil technologique qui associe accompagnement stratégique et expertise technique opérationnelle.'\n    },\n    en: {\n      name: 'Technology Advisory & Technical Expertise',\n      slogan: 'Expertise That Moves You Forward.',\n      triad: 'Strategic thinking. Technical depth. Human perspective.',\n      mission: 'EidosFlow helps business leaders turn strategy into execution through advisory and technical expertise.',\n      desc: 'EidosFlow is an independent technology advisory and consulting firm combining strategic guidance with hands-on technical expertise.'\n    }\n  };\n  static ICONS = {\n    linkedin: 'M20
